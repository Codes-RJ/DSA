name: C++ Curriculum Verification

on:
  push:
    paths:
      - "1. C++/**"
      - ".github/workflows/cpp-curriculum.yml"
  pull_request:
    paths:
      - "1. C++/**"
      - ".github/workflows/cpp-curriculum.yml"

permissions:
  contents: read

jobs:
  linux:
    name: Linux / ${{ matrix.compiler }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: GCC
            cxx: g++
          - compiler: Clang
            cxx: clang++
    env:
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S "1. C++" -B build -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: Linux / GCC / ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S "1. C++" -B build -DBUILD_TESTING=ON -DDSA_ENABLE_SANITIZERS=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    name: Windows / MSVC
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S "1. C++" -B build -DBUILD_TESTING=ON -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release

  documentation:
    name: Markdown links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check local links
        run: python "1. C++/tools/check_markdown_links.py" "1. C++"
